name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chấp nhận giấy phép Android SDK có sẵn
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Tìm thư mục dự án & Build APK
        run: |
          APP_GRADLE=$(find . -maxdepth 4 -path "*/app/build.gradle.kts" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            ZIP_FILE=$(ls -t *Android*.zip *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Tìm thấy file ZIP: $ZIP_FILE -> tự giải nén để build..."
              mkdir -p _unzipped
              unzip -oq "$ZIP_FILE" -d _unzipped
              APP_GRADLE=$(find _unzipped -maxdepth 4 -path "*/app/build.gradle.kts" | head -n 1)
            fi
          fi
          if [ -z "$APP_GRADLE" ]; then
            echo "❌ Không tìm thấy app/build.gradle.kts hoặc file ZIP Android trong repo!"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi
          DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "Thư mục dự án Android: $DIR"
          echo "BUILD_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Đổi tên APK
        run: cp "$BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk" ChamTN_NamQT-2.0.apk

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: ChamTN_NamQT-2.0-APK
          path: ChamTN_NamQT-2.0.apk
